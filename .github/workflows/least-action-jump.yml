name: Least-action jump
on:
  pull_request:
    paths:
      - 'python/matrix_tricks/least_action_jump.py'
      - '.github/workflows/least-action-jump.yml'
      - 'docs/LAW-LEAST-ACTION-JUMP-20261128.md'
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 python/matrix_tricks/least_action_jump.py | tee receipt.txt
        shell: bash
      - run: grep -Fx 'PASS controls=4 horizon=3^40 sha256=994ef829b8095f846f7565b97febc3add77a80b4838a3a911b248c6a9bd9257c' receipt.txt
