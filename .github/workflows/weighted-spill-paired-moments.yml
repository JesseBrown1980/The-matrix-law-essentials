name: Exact weighted target-spill and paired odd moment law
on:
  pull_request:
    paths:
      - 'python/matrix_tricks/weighted_spill_paired_odd.py'
      - 'docs/LAW-WEIGHTED-TARGET-SPILL-PAIRED-MOMENTS-20261114.md'
      - '.github/workflows/weighted-spill-paired-moments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-weighted-operator-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Four exact weighted Q passes, eight Gram and undirected edge moments
        run: |
          set -euo pipefail
          python3 -I -B python/matrix_tricks/weighted_spill_paired_odd.py | tee weighted-spill-paired-odd.hbp
          test "$(grep -c '^WEIGHTED_MOMENT_POINT|' weighted-spill-paired-odd.hbp)" -eq 4
          grep -Fq 'outward_operator_passes=3|exact_moments=8|final_odd_computed_without_next_vector=1|' weighted-spill-paired-odd.hbp
          grep -Fq 'support_spill_odd=PASS|on_support_undirected_odd_form=PASS|' weighted-spill-paired-odd.hbp
          grep -Fq 'missing_self_loop=DETECTED_BY_DIFFERENCE|missing_cross_edge=DETECTED_BY_DIFFERENCE|edge_to_self_loops_same_W_same_72=REFUSED_BY_RAW_MOVE_WITNESS|' weighted-spill-paired-odd.hbp
          grep -Fq 'unprojected_P_return=REJECTED|wrong_W=REJECTED|' weighted-spill-paired-odd.hbp
          grep -Fq 'next_vector_has_nonzero_outside_support=1|odd_from_only_original_support=PASS|actual_next_outer_vector_stored_by_odd_method=0|' weighted-spill-paired-odd.hbp
          grep -Fq 'finite_3x4_actual_source=NOT_COMPUTED|Wilson_weight=HOLD' weighted-spill-paired-odd.hbp
      - uses: actions/upload-artifact@v4
        with:
          name: weighted-spill-paired-odd-exact
          path: weighted-spill-paired-odd.hbp
          retention-days: 60
