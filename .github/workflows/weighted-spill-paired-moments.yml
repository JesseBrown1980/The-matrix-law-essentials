name: Exact weighted target-spill and paired odd moment law
on:
  pull_request:
    paths:
      - 'python/matrix_tricks/weighted_spill_paired_odd.py'
      - 'docs/LAW-WEIGHTED-TARGET-SPILL-PAIRED-MOMENTS-20261114.md'
      - '.github/workflows/weighted-spill-paired-moments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-weighted-operator-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Four exact weighted Q passes, eight Gram and undirected edge moments
        run: |
          set -euo pipefail
          python3 -I -B python/matrix_tricks/weighted_spill_paired_odd.py | tee weighted-spill-paired-odd.hbp
          test "$(grep -c '^WEIGHTED_MOMENT_POINT|' weighted-spill-paired-odd.hbp)" -eq 4
          grep -Fq 'production_outward_passes=3|exact_moments=8|saved_final_full_vector_action=1|signed_eight_lane_offset_control=PASS|actual_outer_Q_spill_witness=PASS|' weighted-spill-paired-odd.hbp
          grep -Fq 'exact_signed_bias_roundtrip=PASS|unsigned_negative_values=FORBIDDEN|insufficient_lane_width=REFUSED|incorrect_bias_subtraction=REJECTED|' weighted-spill-paired-odd.hbp
          grep -Fq 'raw_oracle_self_loop_drop=REFUSED|raw_oracle_cross_edge_drop=REFUSED|balanced_72_row_forged_self_loops=REFUSED|' weighted-spill-paired-odd.hbp
          grep -Fq 'wrong_W=REJECTED|unprojected_P_return=REJECTED|' weighted-spill-paired-odd.hbp
          grep -Fq 'finite_3x4_actual_source=NOT_COMPUTED|Wilson_weight=HOLD' weighted-spill-paired-odd.hbp
      - uses: actions/upload-artifact@v4
        with:
          name: weighted-spill-paired-odd-exact
          path: weighted-spill-paired-odd.hbp
          retention-days: 60
