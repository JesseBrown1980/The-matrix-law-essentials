name: Vienna nanoparticle 43M ternary virtual-slice test
on:
  push:
    branches: [gpt6-vienna-nanoparticle-quantum-ternary-slices-20261106, main]
    paths:
      - 'python/matrix_tricks/vienna_nanoparticle_slices_20261106.py'
      - 'data/vienna_nanoparticle/**'
      - 'docs/VIENNA-NANOPARTICLE-INTERFERENCE-20261106.md'
      - '.github/workflows/vienna-nanoparticle-43m.yml'
  pull_request:
    paths:
      - 'python/matrix_tricks/vienna_nanoparticle_slices_20261106.py'
      - 'data/vienna_nanoparticle/**'
      - 'docs/VIENNA-NANOPARTICLE-INTERFERENCE-20261106.md'
      - '.github/workflows/vienna-nanoparticle-43m.yml'
jobs:
  quantum-virtual-43m:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify prediction freeze and compute actual numerical result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vienna
          test "$(grep -c '^PREDICT|id=' data/vienna_nanoparticle/PREDICTIONS-20261106.hbp)" -eq 12
          test "$(grep -c '^PREDICT|id=' data/vienna_nanoparticle/PREDICTIONS-43046721-20261106.hbp)" -eq 8
          python3 python/audit/integer_only_audit.py python/matrix_tricks/vienna_nanoparticle_slices_20261106.py
          python3 -I python/matrix_tricks/vienna_nanoparticle_slices_20261106.py --self-test | tee build/vienna/INTEGER-REPLAY-20261108.hbp
          test "$(grep -c '^VIENNA_INT_PHASE|' build/vienna/INTEGER-REPLAY-20261108.hbp)" -eq 4
          grep -F 'VIENNA_INT_VERIFY|status=PASS|engine=INTEGER_FIXED_POINT|' build/vienna/INTEGER-REPLAY-20261108.hbp
          grep -F '|original_measured_unchanged=1|' build/vienna/INTEGER-REPLAY-20261108.hbp
          (cd build/vienna && sha256sum INTEGER-REPLAY-20261108.hbp > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-43million-integer-crosscheck-receipts
          path: build/vienna/
          if-no-files-found: warn
