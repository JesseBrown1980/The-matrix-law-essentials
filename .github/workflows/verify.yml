name: verify (Rust 1.81, integer-only)

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81 with clippy
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.81.0
          rustc --version
      - name: Clippy, warnings are errors
        run: cargo clippy --release --all-targets -- -D warnings
      - name: No floating point in Rust sources
        run: |
          if grep -rnE '\bf(32|64)\b' crates/*/src; then echo "FLOAT|status=FAIL|json=0"; exit 1; fi
          echo "FLOAT|status=PASS|json=0"
      - name: rustfmt on crates/jump3
        run: cargo fmt -p jump3 -- --check
      - name: Power-of-three jump and transposition memo, Python and Rust byte for byte
        run: |
          cargo build --release -q -p jump3
          cargo test --release -q -p jump3
          python3 python/matrix_tricks/jump3_ntt.py --self-test > "$RUNNER_TEMP/jump3_py.hbp"
          target/release/jump3 --self-test > "$RUNNER_TEMP/jump3_rs.hbp"
          cmp "$RUNNER_TEMP/jump3_py.hbp" "$RUNNER_TEMP/jump3_rs.hbp"
          cmp "$RUNNER_TEMP/jump3_py.hbp" data/jump3/JUMP3-SELFTEST.hbp
          python3 python/matrix_tricks/transposition_memo.py --self-test > "$RUNNER_TEMP/transmemo_py.hbp"
          target/release/transmemo --self-test > "$RUNNER_TEMP/transmemo_rs.hbp"
          cmp "$RUNNER_TEMP/transmemo_py.hbp" "$RUNNER_TEMP/transmemo_rs.hbp"
          cmp "$RUNNER_TEMP/transmemo_py.hbp" data/jump3/TRANSMEMO-SELFTEST.hbp
          echo "JUMP3_BYTES|status=PASS|json=0"
      - name: End-to-end reproduction
        run: ./verify.sh
