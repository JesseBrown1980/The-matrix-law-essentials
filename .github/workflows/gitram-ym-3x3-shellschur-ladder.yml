# GitRAM lane: band-gap AND vacuum-cluster certificates for the FULL 3x3
# zero-momentum operator at r = JB/JE = 9, 15, 27, 45, 81, by magnetic-shell Schur
# inertia (crates/sturmrs/src/bin/shellschur.rs). Template: JesseBrown1980/GitRAM.
# Thresholds (micro-units) come from the sealed sector receipt
# data/volume/ym3x3/YM3X3-SECTORS-GITRAM.hbp:
#   t0 = lowest interval lo - 2   (expect N = 0:  E1 >= t0)
#   ts = second interval lo - 2   (expect N = 1:  E1 < ts <= E2)
#   t1 = cluster top hi + 2       (expect N = 8)
#   tB = E9 interval lo, 1 milli-unit below, rounded down (expect N = 8)
# r = 9 and 27 already hold t1/tB certificates (and r = 27 its t0/ts) in
# data/volume/ym3x3/. Every core here is at most 101 states, so each cell is one
# whole shellschur run. Fan-in: all 30 cells present and checksummed, identical
# matrix shas per sector, then python/volume/shell_gap_cert.py per coupling.
# Integer-only, json=0.
name: GitRAM YM 3x3 shell-Schur gap + cluster certificates, 5 couplings (30 cells)

on:
  workflow_dispatch:
  push:
    branches: [ym-3x3-zero-momentum-sectors]
    paths: ['.github/workflows/gitram-ym-3x3-shellschur-ladder.yml']

permissions:
  contents: read

concurrency:
  group: gitram-ym3x3-shellschur-ladder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Cell ${{ matrix.id }} r=${{ matrix.r }} (${{ matrix.sx }},${{ matrix.sy }}) t=${{ matrix.t }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "01", r: 9, sx: 1, sy: 1, t: 52420786, fdig: 13, tol: 10}
          - {id: "02", r: 9, sx: 1, sy: 1, t: 52440620, fdig: 13, tol: 10}
          - {id: "03", r: 9, sx: -1, sy: -1, t: 52440620, fdig: 13, tol: 10}
          - {id: "04", r: 15, sx: 1, sy: 1, t: 53075973, fdig: 13, tol: 10}
          - {id: "05", r: 15, sx: 1, sy: 1, t: 53082647, fdig: 13, tol: 10}
          - {id: "06", r: 15, sx: -1, sy: -1, t: 53082647, fdig: 13, tol: 10}
          - {id: "07", r: 15, sx: 1, sy: 1, t: 53114486, fdig: 12, tol: 1000}
          - {id: "08", r: 15, sx: -1, sy: -1, t: 53114486, fdig: 12, tol: 1000}
          - {id: "09", r: 15, sx: 1, sy: 1, t: 96486000, fdig: 12, tol: 1000}
          - {id: "10", r: 15, sx: -1, sy: -1, t: 96486000, fdig: 12, tol: 1000}
          - {id: "11", r: 15, sx: 1, sy: -1, t: 96486000, fdig: 12, tol: 1000}
          - {id: "12", r: 15, sx: -1, sy: 1, t: 96486000, fdig: 12, tol: 1000}
          - {id: "13", r: 45, sx: 1, sy: 1, t: 53697698, fdig: 13, tol: 10}
          - {id: "14", r: 45, sx: 1, sy: 1, t: 53698418, fdig: 13, tol: 10}
          - {id: "15", r: 45, sx: -1, sy: -1, t: 53698418, fdig: 13, tol: 10}
          - {id: "16", r: 45, sx: 1, sy: 1, t: 53701954, fdig: 12, tol: 1000}
          - {id: "17", r: 45, sx: -1, sy: -1, t: 53701954, fdig: 12, tol: 1000}
          - {id: "18", r: 45, sx: 1, sy: 1, t: 188214000, fdig: 12, tol: 1000}
          - {id: "19", r: 45, sx: -1, sy: -1, t: 188214000, fdig: 12, tol: 1000}
          - {id: "20", r: 45, sx: 1, sy: -1, t: 188214000, fdig: 12, tol: 1000}
          - {id: "21", r: 45, sx: -1, sy: 1, t: 188214000, fdig: 12, tol: 1000}
          - {id: "22", r: 81, sx: 1, sy: 1, t: 53832588, fdig: 13, tol: 10}
          - {id: "23", r: 81, sx: 1, sy: 1, t: 53832807, fdig: 13, tol: 10}
          - {id: "24", r: 81, sx: -1, sy: -1, t: 53832807, fdig: 13, tol: 10}
          - {id: "25", r: 81, sx: 1, sy: 1, t: 53834020, fdig: 12, tol: 1000}
          - {id: "26", r: 81, sx: -1, sy: -1, t: 53834020, fdig: 12, tol: 1000}
          - {id: "27", r: 81, sx: 1, sy: 1, t: 296568000, fdig: 12, tol: 1000}
          - {id: "28", r: 81, sx: -1, sy: -1, t: 296568000, fdig: 12, tol: 1000}
          - {id: "29", r: 81, sx: 1, sy: -1, t: 296568000, fdig: 12, tol: 1000}
          - {id: "30", r: 81, sx: -1, sy: 1, t: 296568000, fdig: 12, tol: 1000}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build tools from in-repo source
        run: cargo build --release -q
      - name: One unit of work, gated on its own PASS markers
        run: |
          set -euo pipefail
          mkdir -p out build/ymsec
          o=out/cell-${{ matrix.id }}.hbp
          m=build/ymsec/s33_${{ matrix.sx }}_${{ matrix.sy }}.matrix
          target/release/ymsec 3 3 ${{ matrix.sx }} ${{ matrix.sy }} $m | sed "s/^YMSEC/SSL_BUILD/" | tee $o
          grep -q '|commutes_with_H=PASS|' $o
          grep -q '|w_self_adjoint=PASS|' $o
          sha256sum $m | sed 's/^/MATRIX_SHA|/' >> $o
          target/release/shellschur $m 1000 $(( ${{ matrix.r }} * 1000 )) ${{ matrix.t }} -1 ${{ matrix.fdig }} ${{ matrix.tol }} 4000 | sed "s/^/r${{ matrix.r }}_S${{ matrix.sx }}_${{ matrix.sy }}|/" | tee -a $o
          grep -q '|SHELL_SCHUR|.*|ambiguous=0|result=PASS|' $o
          echo "GITRAM_CELL|id=${{ matrix.id }}|r=${{ matrix.r }}|sx=${{ matrix.sx }}|sy=${{ matrix.sy }}|t=${{ matrix.t }}|json=0" >> $o
          (cd out && sha256sum cell-${{ matrix.id }}.hbp > cell-${{ matrix.id }}.sha256)
          echo GITRAM_SHARD_PASS
      - name: Upload the self-contained cell checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out/cell-*

  fan-in:
    name: Verify ALL 30 checkpoints, certify five couplings, seal
    needs: cell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: fan-in
          merge-multiple: true
      - name: Require ALL checkpoints, consistent matrices, certify, seal
        run: |
          set -euo pipefail
          count="$(ls fan-in/cell-*.hbp | wc -l)"
          echo "returned=$count expected=30"
          (cd fan-in && for f in cell-*.sha256; do sha256sum -c "$f"; done)
          test "$count" -eq 30
          (cd data/volume/ym3x3 && sha256sum -c YM3X3-SECTORS-GITRAM.sha256)
          # one matrix sha per sector across all cells
          for s in s33_1_1 s33_-1_-1 s33_1_-1 s33_-1_1; do
            k=$(grep -h "^MATRIX_SHA|.*/$s.matrix" fan-in/cell-*.hbp | cut -d' ' -f1 | sort -u | wc -l)
            echo "$s distinct_shas=$k"; test "$k" -le 1
          done
          cat fan-in/cell-*.hbp > YM3X3-SHELLSCHUR-LADDER-GITRAM.hbp
          D=data/volume/ym3x3; S=$D/YM3X3-SECTORS-GITRAM.hbp; out=YM3X3-SHELLSCHUR-LADDER-GITRAM.hbp
          python3 python/volume/shell_gap_cert.py $S 9 $out $D/YM3X3-SHELLSCHUR-R9-SUMMARY.hbp | tee -a certs.hbp
          python3 python/volume/shell_gap_cert.py $S 27 $D/shellschur_r27.hbp $D/shellschur_r27_cluster.hbp | tee -a certs.hbp
          for r in 15 45 81; do python3 python/volume/shell_gap_cert.py $S $r $out | tee -a certs.hbp; done
          cat certs.hbp >> $out
          g=$(grep -c '^SHELL_GAP_CERT|.*|result=PASS|' certs.hbp); c=$(grep -c '^SHELL_CLUSTER_CERT|.*N(ts)=1|.*|result=PASS|' certs.hbp)
          if [ "$count" -eq 30 ] && [ "$g" -eq 5 ] && [ "$c" -eq 5 ]; then st=PASS; else st=FAIL; fi
          echo "GITRAM_SEAL|cells=$count|expected=30|gap_certs=$g/5|cluster_certs=$c/5|status=$st|json=0" >> $out
          sha256sum $out > YM3X3-SHELLSCHUR-LADDER-GITRAM.sha256
          test "$st" = PASS
      - name: Upload the sealed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-ym3x3-shellschur-ladder
          retention-days: 30
          if-no-files-found: error
          path: YM3X3-SHELLSCHUR-LADDER-GITRAM.*
